<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab_4</title>
  </head>
  <body>
    <h1>Моя перша HTML-форма</h1>
    <form method="post" action="https://httpbin.org/post">
      <label for="username">Ім'я:</label>
      <input type="text" id="username" name="username">
      <label>Дата народження:<input type="date" name="birthdate"></label>
      <label>Імейл:<input type="email" name="email"></label>
      <label>Повідомлення:<textarea name="message" rows="1"></textarea></label>
      <fieldset>
        <legend>Ваші улюблені напої?</legend>
        <label><input type="checkbox" name="drinks" value="coffee"> Кавій</label>
        <label><input type="checkbox" name="drinks" value="tea"> Чайок</label>
        <label><input type="checkbox" name="drinks" value="juice"> Сік</label>
        <label><input type="checkbox" name="drinks" value="water"> Водичка</label>
      </fieldset>
      <fieldset>
        <legend>Вудкіля ви?</legend>
        <label><input type="radio" name="nationality" value="ukrainian"> Україна</label>
        <label><input type="radio" name="nationality" value="polish"> Польша</label>
        <label><input type="radio" name="nationality" value="other"> Десь інде</label>
      </fieldset>
      <button type="submit">Відправити</button>
      <button type="reset">Очистити</button>
    </form>
    <picture>
      <source media="(min-width: 468px)" srcset="https://picsum.photos/1000/400">
      <img src="https://picsum.photos/300/500" alt="Файна фотка">
    </picture>
  </body>
</html>
